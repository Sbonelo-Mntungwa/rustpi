# Collaboration on rustpi happens through issues. Pull requests from
# anyone but the owner are closed with a pointer to the issue tracker.
# pull_request_target never checks out the pull request's code.
name: Close pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Close with a pointer to issues
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr close "$PR" --repo "$REPO" --comment "Thanks for your interest in rustpi. This repository doesn't take pull requests. Please open an issue describing the change or bug instead: https://github.com/$REPO/issues/new"
